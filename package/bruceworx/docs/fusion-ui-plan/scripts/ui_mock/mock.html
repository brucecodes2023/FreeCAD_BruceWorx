<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BruceWorx UI mock</title>
<style>
:root {
  --accent: #007aff; --accent-soft: rgba(0,122,255,.14); --accent-line: rgba(0,122,255,.55);
  --chrome: #e9e9ec; --chrome-2: #f3f3f5; --chrome-line: rgba(0,0,0,.10);
  --card: rgba(255,255,255,.88); --card-solid: #ffffff; --card-line: rgba(0,0,0,.10);
  --field: #ffffff; --field-line: rgba(0,0,0,.14);
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
  --hover: rgba(0,0,0,.05); --shadow: 0 6px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.08);
  --vp-top: #fbfbfc; --vp-bot: #dfe3e9; --grid: rgba(0,0,0,.06); --grid-2: rgba(0,0,0,.12);
  --sk-line: #1d1d1f; --sk-free: #0a6cff; --sk-dim: #3a3a3c; --sk-cons: rgba(0,0,0,.45);
  --ok: #1f9d55; --warn: #c27c00;
}
body.dark {
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,.22); --accent-line: rgba(10,132,255,.65);
  --chrome: #232326; --chrome-2: #2a2a2d; --chrome-line: rgba(255,255,255,.08);
  --card: rgba(38,38,41,.90); --card-solid: #2c2c2f; --card-line: rgba(255,255,255,.10);
  --field: #1c1c1e; --field-line: rgba(255,255,255,.14);
  --text: #ececef; --text-2: #a1a1a6; --text-3: #808085;
  --hover: rgba(255,255,255,.06); --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  --vp-top: #4a4f57; --vp-bot: #26292e; --grid: rgba(255,255,255,.05); --grid-2: rgba(255,255,255,.11);
  --sk-line: #f2f2f4; --sk-free: #5eb0ff; --sk-dim: #d8d8dc; --sk-cons: rgba(255,255,255,.5);
  --ok: #32d74b; --warn: #ffb340;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
body { font: 12px/1.3 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: var(--text);
  background: var(--chrome); -webkit-font-smoothing: antialiased; }
img.ic { width: 24px; height: 24px; display: block; }
img.i16 { width: 16px; height: 16px; display: block; flex: none; }
img.i14 { width: 14px; height: 14px; display: block; flex: none; }
img.i20 { width: 20px; height: 20px; display: block; flex: none; }
svg.g { width: 16px; height: 16px; stroke: var(--text-2); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Title bar ----------------------------------------------------------- */
.title { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px;
  background: var(--chrome); border-bottom: 1px solid var(--chrome-line); }
.lights { display: flex; gap: 8px; margin-right: 10px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.tbtn { width: 28px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.tbtn:hover { background: var(--hover); }
.tbtn img { width: 18px; height: 18px; }
.sep { width: 1px; height: 18px; background: var(--chrome-line); margin: 0 6px; }
.doctabs { display: flex; align-items: flex-end; height: 40px; gap: 2px; margin-left: 4px; }
.doctab { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 10px; border-radius: 7px 7px 0 0;
  color: var(--text-2); min-width: 120px; max-width: 200px; }
.doctab.on { background: var(--chrome-2); color: var(--text); box-shadow: 0 -1px 0 var(--chrome-line) inset; border: 1px solid var(--chrome-line); border-bottom: none; height: 31px; }
.doctab .x { margin-left: auto; color: var(--text-3); font-size: 13px; }
.doctab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-2); margin-left: auto; }
.doctab.plus { min-width: 0; padding: 0 8px; font-size: 16px; color: var(--text-2); }
.search { margin-left: auto; width: 300px; height: 26px; border-radius: 7px; background: var(--field); border: 1px solid var(--field-line);
  display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--text-3); }
.search kbd { margin-left: auto; font: 11px -apple-system; color: var(--text-3); border: 1px solid var(--field-line); border-radius: 4px; padding: 0 4px; }
.pill { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: 12px; color: var(--text-2); font-size: 11.5px; }
.pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; margin-left: 4px; }

/* Workspace row and toolbar ---------------------------------------------- */
.tabsrow { height: 30px; display: flex; align-items: stretch; gap: 0; padding: 0 10px; background: var(--chrome-2); }
.ws { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 6px; margin: 3px 10px 3px 0; border-radius: 6px;
  border: 1px solid var(--field-line); background: var(--field); font-weight: 600; font-size: 11.5px; letter-spacing: .02em; }
.ws .car { color: var(--text-2); font-size: 9px; margin-left: 2px; }
.tab { display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--text-2);
  border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.tab.ctx { color: var(--accent); }
.tab.ctx.on { color: var(--accent); }
.toolbar { height: 64px; display: flex; align-items: stretch; padding: 4px 8px 2px; background: var(--chrome-2); border-bottom: 1px solid var(--chrome-line); }
.grp { display: flex; flex-direction: column; align-items: center; padding: 0 8px; border-right: 1px solid var(--chrome-line); }
.grp:last-child { border-right: none; }
.grp .icons { display: flex; gap: 2px; height: 38px; align-items: center; }
.grp .icons span { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.grp .icons span.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.grp .cap { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--text-2); margin-top: 3px; white-space: nowrap; }
.grp .cap::after { content: " \25BE"; font-size: 8px; }
.grp.finish .icons span { width: auto; padding: 0 10px 0 6px; gap: 6px; background: var(--card-solid); border: 1px solid var(--field-line); font-weight: 600; font-size: 11.5px; color: var(--ok); }
.grp.finish .cap::after { content: ""; }

/* Viewport ------------------------------------------------------------------ */
.vp { position: relative; height: 806px; background: linear-gradient(180deg, var(--vp-top), var(--vp-bot)); overflow: hidden; }
.vp > img.model { position: absolute; left: 50%; top: 50%; width: 1200px; height: 750px; transform: translate(-46%, -52%); }
.card { position: absolute; background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); overflow: hidden; }
.chead { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  color: var(--text-2); border-bottom: 1px solid var(--card-line); }
.chead .r { margin-left: auto; display: flex; gap: 8px; color: var(--text-3); font-weight: 400; letter-spacing: 0; }
.chead.big { height: 36px; font-size: 11.5px; color: var(--text); }
.chead.big img { width: 18px; height: 18px; }

/* Browser */
.browser { left: 10px; top: 10px; width: 272px; }
.tree { padding: 4px 0 6px; }
.row { height: 22px; display: flex; align-items: center; gap: 6px; padding-right: 8px; white-space: nowrap; }
.row:hover { background: var(--hover); }
.row .chev { width: 10px; color: var(--text-3); font-size: 8px; text-align: center; flex: none; }
.row .lbl { overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--text-3); margin-left: 6px; font-size: 11px; }
.row .eye { margin-left: auto; opacity: .55; }
.row.sel { background: var(--accent-soft); }
.row.sel .lbl { font-weight: 600; }
.row.edit .lbl::after { content: "editing"; margin-left: 6px; font-size: 10px; color: var(--accent); font-weight: 600; }
.row.dim .lbl { color: var(--text-3); }
.row.err .lbl { color: #e5484d; }
.badge { font-size: 9.5px; padding: 1px 5px; border-radius: 4px; background: var(--hover); color: var(--text-2); font-weight: 600; margin-left: 6px; }
.badge.wip { color: var(--warn); }
.props { border-top: 1px solid var(--card-line); }
.prow { display: grid; grid-template-columns: 112px 1fr; height: 21px; align-items: center; padding: 0 10px; }
.prow .k { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .v.ro { color: var(--text-3); }
.pgrp { padding: 6px 10px 2px; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); }

/* Command dialog */
.dlg { right: 12px; top: 98px; width: 304px; }
.dbody { padding: 8px 12px 6px; }
.f { display: grid; grid-template-columns: 104px 1fr; align-items: center; min-height: 28px; gap: 8px; }
.f .k { color: var(--text-2); }
.in { height: 24px; border-radius: 6px; background: var(--field); border: 1px solid var(--field-line); display: flex; align-items: center; padding: 0 7px; gap: 6px; }
.in.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in .u { margin-left: auto; color: var(--text-3); }
.in .car { margin-left: auto; color: var(--text-3); font-size: 9px; }
.chip { height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 4px 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--text); font-size: 11.5px; }
.chip .x { color: var(--text-2); padding: 0 3px; }
.chip.n { background: var(--hover); }
.cb { display: inline-flex; align-items: center; gap: 7px; }
.cb i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--field-line); background: var(--field); display: inline-flex; align-items: center; justify-content: center; }
.cb i.on { background: var(--accent); border-color: var(--accent); }
.cb i.on::after { content: ""; width: 7px; height: 4px; border-left: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
.dsec { margin: 8px -12px 2px; padding: 6px 12px 0; border-top: 1px solid var(--card-line); font-size: 10px; font-weight: 700; letter-spacing: .07em; color: var(--text-3);
  display: flex; align-items: center; }
.dsec .r { margin-left: auto; font-weight: 400; letter-spacing: 0; }
.dfoot { white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--card-line); }
.btn { height: 24px; padding: 0 14px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--field-line); background: var(--card-solid); font-size: 12px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.sm { height: 22px; padding: 0 9px; font-size: 11.5px; }
.help { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--field-line); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--field-line); border-radius: 6px; overflow: hidden; height: 24px; }
.seg span { padding: 0 7px; display: flex; align-items: center; color: var(--text-2); border-right: 1px solid var(--field-line); font-size: 11.5px; }
.seg span:last-child { border-right: none; }
.seg span.on { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.range { position: relative; height: 26px; margin: 2px 0 0; }
.range .bar { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--hover); border: 1px solid var(--field-line); }
.range .fill { position: absolute; top: 11px; height: 4px; border-radius: 2px; background: var(--accent-line); }
.range .knob { position: absolute; top: 5px; width: 2px; height: 16px; background: var(--text); border-radius: 1px; }
.range .tk { position: absolute; top: 18px; font-size: 10px; color: var(--text-3); transform: translateX(-50%); }
.list { border: 1px solid var(--field-line); border-radius: 6px; background: var(--field); margin-top: 4px; }
.list .li { height: 21px; display: flex; align-items: center; gap: 7px; padding: 0 7px; border-bottom: 1px solid var(--card-line); }
.list .li:last-child { border-bottom: none; }
.list .li .v { margin-left: auto; color: var(--text-2); }
.list .li.sel { background: var(--accent-soft); }

/* View cube and nav bar */
.cubebox { position: absolute; right: 22px; top: 14px; width: 74px; height: 74px; perspective: 400px; }
.cube { position: absolute; left: 13px; top: 10px; width: 46px; height: 46px; transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(-45deg); }
.cube div { position: absolute; width: 46px; height: 46px; border: 1px solid var(--grid-2); background: var(--card-solid); opacity: .95;
  display: flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; color: var(--text-2); letter-spacing: .04em; }
.cube .fr { transform: translateZ(23px); } .cube .rt { transform: rotateY(90deg) translateZ(23px); } .cube .tp { transform: rotateX(90deg) translateZ(23px); background: var(--chrome-2); }
.home { position: absolute; right: 86px; top: 12px; opacity: .7; }
.nav { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 9px; }
.nav span { width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.nav span.on { background: var(--accent-soft); }
.nav .vs { width: 1px; height: 18px; background: var(--card-line); margin: 0 4px; }
.axes { position: absolute; left: 22px; bottom: 16px; }
.tag { position: absolute; padding: 3px 8px; border-radius: 6px; background: var(--card-solid); border: 1px solid var(--card-line); box-shadow: var(--shadow); font-size: 11.5px; font-weight: 600; }

/* Timeline and status */
.timeline { height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--chrome-2); border-top: 1px solid var(--chrome-line); }
.timeline .ctl { display: flex; gap: 2px; margin-right: 8px; color: var(--text-2); }
.timeline .ctl span { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 5px; font-size: 10px; }
.timeline .it { width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
.timeline .it.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.timeline .marker { width: 3px; height: 26px; border-radius: 2px; background: var(--accent); margin: 0 3px; }
.timeline .after { opacity: .35; }
.timeline .r { margin-left: auto; color: var(--text-3); display: flex; gap: 10px; align-items: center; }
.status { height: 24px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--chrome); border-top: 1px solid var(--chrome-line); color: var(--text-2); font-size: 11.5px; }
.status .r { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.status .k { color: var(--text-3); }
.status .okc { color: var(--ok); }

/* Start page */
.start { height: 936px; display: grid; grid-template-columns: 248px 1fr; background: var(--chrome-2); }
.side { border-right: 1px solid var(--chrome-line); padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; }
.side h4, .main h4 { margin: 14px 4px 6px; font-size: 10.5px; letter-spacing: .07em; color: var(--text-3); }
.side h4:first-child { margin-top: 0; }
.nbtn { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 7px; }
.nbtn:hover, .nbtn.on { background: var(--hover); }
.nbtn img { width: 20px; height: 20px; }
.nbtn .kb { margin-left: auto; color: var(--text-3); font-size: 11px; }
.vault { margin-top: 4px; padding: 10px; border-radius: 9px; border: 1px solid var(--card-line); background: var(--card-solid); }
.vault .vr { display: flex; justify-content: space-between; height: 20px; align-items: center; }
.vault .vr .n { font-weight: 600; }
.main { padding: 18px 24px; overflow: hidden; }
.mh { display: flex; align-items: center; gap: 10px; }
.mh h2 { margin: 0; font-size: 17px; font-weight: 650; }
.mh .search { margin-left: auto; width: 260px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 14px; }
.fc { border: 1px solid var(--card-line); border-radius: 10px; background: var(--card-solid); overflow: hidden; }
.fc .th { height: 128px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.fc .th img { max-width: 100%; max-height: 100%; }
.fc .th img.crop { width: 230%; max-width: none; max-height: none; }
.fc .fi { padding: 7px 10px 9px; }
.fc .fn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc .fm { color: var(--text-2); font-size: 11px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.state { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .03em; }
.state.wip { background: rgba(255,159,10,.16); color: var(--warn); }
.state.rel { background: rgba(48,209,88,.16); color: var(--ok); }
.state.rev { background: var(--accent-soft); color: var(--accent); }
.tbl { margin-top: 18px; border: 1px solid var(--card-line); border-radius: 10px; background: var(--card-solid); overflow: hidden; }
.tr { display: grid; grid-template-columns: 28px 2.1fr 1.3fr .6fr .8fr 1.1fr 1fr; height: 28px; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--card-line); }
.tr:last-child { border-bottom: none; }
.tr.h { color: var(--text-3); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; height: 26px; background: var(--hover); }
.tr .m { color: var(--text-2); }
.foot { display: flex; align-items: center; margin-top: 14px; color: var(--text-2); }
.foot .r { margin-left: auto; }

/* Dark mode: faint light plate behind icons so dark-outlined icons stay readable */
body.dark .grp .icons span:not(.on), body.dark .timeline .it:not(.on), body.dark .nav span:not(.on) { background: rgba(255,255,255,var(--plate)); }
body.dark .grp.finish .icons span { background: var(--card-solid); }
body.dark .row img.i16, body.dark .chead img, body.dark .list .li img.i14, body.dark .chip img.i14, body.dark .in img.i16,
body.dark .nbtn img, body.dark .doctab img.i16, body.dark .tr img.i16, body.dark .ws img.i16 {
  background: rgba(255,255,255,var(--plate)); border-radius: 4px; padding: 2px; box-sizing: content-box; margin: -2px 0; }
body.dark .nav span img, body.dark .timeline .it img { background: none; }
.sheet { padding: 24px 28px; color: var(--text); }
.sheet h3 { margin: 0 0 4px; font-size: 15px; }
.sheet p { margin: 0 0 16px; color: var(--text-2); }
body:has(.sheet) { background: var(--chrome-2); }
.sheet .cols { display: grid; grid-template-columns: 120px repeat(4, 1fr); gap: 10px; align-items: center; }
.sheet .hd { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); }
.sheet .cell { background: var(--chrome-2); border: 1px solid var(--chrome-line); border-radius: 8px; padding: 8px; }
.sheet .strip { display: flex; flex-wrap: wrap; gap: 2px; }
.sheet .strip span { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.sheet .trow { height: 22px; display: flex; align-items: center; gap: 6px; }
.sheet .trow img { border-radius: 4px; padding: 2px; margin: -2px 0; }

/* Callouts */
.co { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #e5484d; color: #fff; font-weight: 700; font-size: 11px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.3); z-index: 9; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q = new URLSearchParams(location.search);
const SCREEN = Q.get("screen") || "part";
if (Q.get("theme") === "dark") document.body.classList.add("dark");
const NOTES = Q.get("notes") === "1";
document.documentElement.style.setProperty("--plate", Q.get("plate") || "0.10");

const ic = (n, c = "ic") => `<img class="${c}" src="icons/${n}.svg">`;
const G = {
  search: '<svg class="g" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>',
  help: '<svg class="g" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.6 1.8c-.6.3-.8.6-.8 1.2"/><circle cx="8" cy="11.4" r=".4" fill="currentColor"/></svg>',
  gear: '<svg class="g" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>',

  const holes = [[24, 16, 1], [66, 16, 1], [24, 38, 1], [66, 38, 0], [45, 27, 0]];
  const glyph = (n, x, y) => `<foreignObject x="${x}" y="${y}" width="18" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="width:18px;height:18px;border-radius:4px;background:var(--card-solid);border:1px solid var(--card-line);display:flex;align-items:center;justify-content:center">${ic(n, "i14")}</div></foreignObject>`;
  const dim = (x1, y1, x2, y2, off, txt, vert) => {

      return `<path d="M${x1} ${y1 - 4}V${yy - 4}M${x2} ${y2 - 4}V${yy - 4}" class="ext"/><path d="M${x1} ${yy}H${x2}" class="dl" marker-start="url(#a)" marker-end="url(#a)"/>

  };
  let grid = "";
  for (let gx = -40; gx <= 160; gx += 5) grid += `<path d="M${X(gx)} 0V806" stroke="${gx % 25 === 0 ? "var(--grid-2)" : "var(--grid)"}"/>`;
  for (let gy = -60; gy <= 120; gy += 5) grid += `<path d="M0 ${Y(gy)}H1600" stroke="${gy % 25 === 0 ? "var(--grid-2)" : "var(--grid)"}"/>`;
  const r = 5;
  const outline = `M${X(r)} ${Y(0)} H${X(90 - r)} A${r * S} ${r * S} 0 0 0 ${X(90)} ${Y(r)} V${Y(60)} H${X(0)} V${Y(r)} A${r * S} ${r * S} 0 0 0 ${X(r)} ${Y(0)} Z`;
