# BruceWorx dark theme tokens. Same sheets as the light theme; only colours
# change. IconPlateColor is the faint light square behind toolbar icons that
# keeps FreeCAD's dark-outlined icons readable (6 % white, roadmap §13.3). It is
# mixed into the toolbar colour because token colours carry no alpha.
PrimaryColor: "#232326"
ChromeColor: "#232326"
GeneralBackgroundColor: "#2A2A2D"
GeneralAlternateBackgroundColor: "#2C2C2F"
CardBackgroundColor: "#2C2C2F"
GeneralBorderColor: "#3A3A3D"
GeneralGridLinesColor: "#333336"
GeneralHeaderBackgroundColor: "#2A2A2D"
GeneralDisabledBackgroundColor: "#333336"
TextForegroundColor: "#ECECEF"
TextSecondaryColor: "#A1A1A6"
TextDisabledColor: "#808085"
TextEditFieldBackgroundColor: "#1C1C1E"
TextUrlColor: "#64B5F6"
AccentColor: "@ThemeAccentColor1"
AccentHoverColor: "blend(@GeneralBackgroundColor,@AccentColor,14)"
AccentSoftColor: "blend(@CardBackgroundColor,@AccentColor,22)"
TextSelectBackgroundColor: "@AccentSoftColor"
HoverColor: "#38383B"
IconPlateColor: "blend(@GeneralBackgroundColor,#FFFFFF,6)"
OkColor: "#32D74B"
WarnColor: "#FFB340"
ErrorColor: "#FF6961"
ButtonTopBackgroundColor: "#3A3A3D"
ButtonBottomBackgroundColor: "#2C2C2F"
GroupboxBackgroundColor: "#2C2C2F"
GroupboxBorderColor: "#3A3A3D"
MenuBackgroundColor: "#2C2C2F"
ScrollbarBackgroundColor: "#636366"
TabbarBackgroundColor: "#232326"
ActiveTabBackgroundColor: "#2A2A2D"
InActiveTabBackgroundColor: "#232326"
DialogBackgroundColor: "#2A2A2D"
CheckBoxBackgroundColor: "#1C1C1E"
CheckBoxBorderColor: "#636366"
StylesheetIconsColor: "light"
InputFieldBorderRadius: "6px"
ToolbarButtonsPadding: "3px"
GlyphColor: "lightgray"
GlyphStrongColor: "white"
CloseGlyphColor: "gray"
CloseGlyphStrongColor: "white"
BrowserCardColor: "rgba(44, 44, 47, 72%)"
# Defaults until bruceworx_appearance.py writes the contrast-checked values to
# Themes/UserParameters (blue accent: white text).
AccentTextColor: "#FFFFFF"
AccentGlyphColor: "white"
