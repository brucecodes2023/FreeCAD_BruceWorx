# BruceWorx fork CI.
# Adapted from upstream .github/workflows/sub_buildPixi.yml: same pixi tasks, same
# ccache settings, and the same upstream test actions (runCPPTests / runPythonTests).
#   * pixi-lock      : GitHub-hosted ubuntu-latest and macos-15 (arm64). Lock check,
#                      plus a locked install on macOS. Runs on pull requests.
#   * bruceworx-pack : GitHub-hosted ubuntu-latest. Preference-pack unit tests
#                      (no compile). Runs on pull requests.
#   * linux-x86_64   : GitHub-hosted ubuntu-latest. Full pixi build, tests, STEP check.
#   * macos-arm64-hosted-dmg : GitHub-hosted macos-15, workflow_dispatch only.
#                      Full build + STEP. Unsigned .dmg upload only if upload_dmg.
#   * macos-arm64 / macos-arm64-dmg : self-hosted Apple Silicon. Runs only when the
#                      repository variable BW_MAC_RUNNER == 'true'. Leave it false
#                      (parked). These jobs must not be pointed at GitHub-hosted labels.

name: BruceWorx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_dmg:
        description: "Also build the unsigned macOS arm64 .dmg, STEP-check the packaged app, and upload it (~1.7 GB). Leave off unless you need the file."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bw-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 5
  CCACHE_MAXSIZE: 1G
  CCACHE_NODIRECT: true
  CCACHE_NOHASHDIR: true
  CCACHE_NOINODECACHE: true
  CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,pch_defines,time_macros"
  CCACHE_COMPILERCHECK: "%compiler% -dumpfullversion -dumpversion"
  config: release

jobs:
  linux-x86_64:
    name: Linux x86_64 (pixi)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      builddir: ${{ github.workspace }}/build/release/
      logdir: ${{ github.workspace }}/logs/
      reportdir: ${{ github.workspace }}/report/
      reportfilename: bw-linux-x86_64-report.md
      cacheKey: bw-pixi-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - name: Add problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/problemMatcher/gcc.json"

      - name: Make directories
        run: mkdir -p "$builddir" "$logdir" "$reportdir"

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            FC-${{ env.cacheKey }}-${{ github.ref }}-
            FC-${{ env.cacheKey }}-refs/heads/main-
            FC-${{ env.cacheKey }}-

      - name: ccache stats (before)
        run: |
          pixi run ccache -z
          pixi run ccache -p

      - name: CMake configure
        run: pixi run configure-${{ env.config }}

      - name: CMake build
        run: pixi run build-${{ env.config }}

      - name: ccache stats (after)
        if: always()
        run: pixi run ccache -s

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}

      - name: C++ tests
        timeout-minutes: 15
        uses: ./.github/workflows/actions/runCPPTests/runAllTests
        with:
          reportdir: ${{ env.reportdir }}
          builddir: ${{ env.builddir }}
          reportFile: ${{ env.reportdir }}${{ env.reportfilename }}

      - name: CMake install
        run: pixi run install-${{ env.config }}

      # FreeCADCmd --version and FreeCAD.Version() print ExeVersion / Major.Minor.Point
      # without BuildVersionSuffix (upstream behaviour), so fall back to the generated
      # Version.h (FCVersionSuffix), which is what About/splash read via BuildVersionSuffix.
      - name: BruceWorx version check
        shell: bash
        run: |
          set +e
          ver="$(pixi run FreeCADCmd -c "import FreeCAD; print(FreeCAD.Version())" 2>&1)"
          echo "FreeCAD.Version() output:"
          echo "$ver"
          if echo "$ver" | grep -qF "bw.1"; then
            echo "BW version check: PASS - suffix bw.1 found in FreeCAD.Version()"
            exit 0
          fi
          echo "BW version check: bw.1 NOT in FreeCAD.Version(); checking generated Version.h"
          hdr="${builddir}src/Build/Version.h"
          if [ -f "$hdr" ] && grep -F 'FCVersionSuffix' "$hdr" | grep -qF -- "-bw.1"; then
            echo "BW version check: PASS - suffix -bw.1 found in header $hdr:"
            grep -F 'FCVersionSuffix' "$hdr"
            exit 0
          fi
          echo "BW version check: FAIL - -bw.1 found in neither FreeCAD.Version() nor $hdr"
          [ -f "$hdr" ] && grep -F 'FCVersion' "$hdr"
          exit 1

      # Same STEP file the hosted macOS job imports (data/tests/Step/as1-ac-214.stp).
      - name: BruceWorx STEP import check
        shell: bash
        run: |
          set -o pipefail
          stepfile="${{ github.workspace }}/data/tests/Step/as1-ac-214.stp"
          test -f "$stepfile"
          pixi run FreeCADCmd "${{ github.workspace }}/package/bruceworx/step-import-check.py" --pass "$stepfile" 2>&1 | tee "${logdir}StepImport.log"
          grep -q "BW STEP check: PASS" "${logdir}StepImport.log"
          grep "BW STEP check:" "${logdir}StepImport.log" >> "$GITHUB_STEP_SUMMARY"

      # Same as upstream sub_buildPixi.yml: Python CLI tests on the installed build.
      # (Upstream's GUI-on-install test is disabled there for Qt6; we follow suit.)
      - name: FreeCAD CLI tests on install
        timeout-minutes: 15
        uses: ./.github/workflows/actions/runPythonTests
        with:
          testDescription: "CLI tests on install"
          testCommand: pixi run FreeCADCmd -t 0
          logFile: ${{ env.logdir }}TestCLIInstall.log
          reportFile: ${{ env.reportdir }}${{ env.reportfilename }}


      - name: Job summary
        if: always()
        run: cat "$reportdir$reportfilename" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bw-linux-x86_64-logs
          path: |
            ${{ env.logdir }}
            ${{ env.reportdir }}

  macos-arm64:
    name: macOS arm64 (pixi, self-hosted)
    # Never run on fork PRs: self-hosted runner is Bruce's Mac.
    if: vars.BW_MAC_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      builddir: ${{ github.workspace }}/build/release/
      logdir: ${{ github.workspace }}/logs/
      reportdir: ${{ github.workspace }}/report/
      reportfilename: bw-macos-arm64-report.md
      cacheKey: bw-pixi-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - name: Add problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/problemMatcher/clang.json"

      - name: Make directories
        run: mkdir -p "$builddir" "$logdir" "$reportdir"

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            FC-${{ env.cacheKey }}-${{ github.ref }}-
            FC-${{ env.cacheKey }}-refs/heads/main-
            FC-${{ env.cacheKey }}-

      - name: ccache stats (before)
        run: |
          pixi run ccache -z
          pixi run ccache -p

      - name: CMake configure
        run: pixi run configure-${{ env.config }}

      - name: CMake build
        run: pixi run build-${{ env.config }}

      - name: ccache stats (after)
        if: always()
        run: pixi run ccache -s

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}

      - name: C++ tests
        timeout-minutes: 15
        uses: ./.github/workflows/actions/runCPPTests/runAllTests
        with:
          reportdir: ${{ env.reportdir }}
          builddir: ${{ env.builddir }}
          reportFile: ${{ env.reportdir }}${{ env.reportfilename }}

      - name: CMake install
        run: pixi run install-${{ env.config }}

      # FreeCADCmd --version and FreeCAD.Version() print ExeVersion / Major.Minor.Point
      # without BuildVersionSuffix (upstream behaviour), so fall back to the generated
      # Version.h (FCVersionSuffix), which is what About/splash read via BuildVersionSuffix.
      - name: BruceWorx version check
        shell: bash
        run: |
          set +e
          ver="$(pixi run FreeCADCmd -c "import FreeCAD; print(FreeCAD.Version())" 2>&1)"
          echo "FreeCAD.Version() output:"
          echo "$ver"
          if echo "$ver" | grep -qF "bw.1"; then
            echo "BW version check: PASS - suffix bw.1 found in FreeCAD.Version()"
            exit 0
          fi
          echo "BW version check: bw.1 NOT in FreeCAD.Version(); checking generated Version.h"
          hdr="${builddir}src/Build/Version.h"
          if [ -f "$hdr" ] && grep -F 'FCVersionSuffix' "$hdr" | grep -qF -- "-bw.1"; then
            echo "BW version check: PASS - suffix -bw.1 found in header $hdr:"
            grep -F 'FCVersionSuffix' "$hdr"
            exit 0
          fi
          echo "BW version check: FAIL - -bw.1 found in neither FreeCAD.Version() nor $hdr"
          [ -f "$hdr" ] && grep -F 'FCVersion' "$hdr"
          exit 1

      # Same script as the Linux job. This job stays skipped while BW_MAC_RUNNER is false.
      - name: BruceWorx STEP import check
        shell: bash
        run: |
          set -o pipefail
          stepfile="${{ github.workspace }}/data/tests/Step/as1-ac-214.stp"
          test -f "$stepfile"
          pixi run FreeCADCmd "${{ github.workspace }}/package/bruceworx/step-import-check.py" --pass "$stepfile" 2>&1 | tee "${logdir}StepImport.log"
          grep -q "BW STEP check: PASS" "${logdir}StepImport.log"
          grep "BW STEP check:" "${logdir}StepImport.log" >> "$GITHUB_STEP_SUMMARY"

      # Same as upstream sub_buildPixi.yml: Python CLI tests on the installed build.
      # (Upstream's GUI-on-install test is disabled there for Qt6; we follow suit.)
      - name: FreeCAD CLI tests on install
        timeout-minutes: 15
        uses: ./.github/workflows/actions/runPythonTests
        with:
          testDescription: "CLI tests on install"
          testCommand: pixi run FreeCADCmd -t 0
          logFile: ${{ env.logdir }}TestCLIInstall.log
          reportFile: ${{ env.reportdir }}${{ env.reportfilename }}

      - name: Job summary
        if: always()
        run: cat "$reportdir$reportfilename" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bw-macos-arm64-logs
          path: |
            ${{ env.logdir }}
            ${{ env.reportdir }}

  macos-arm64-dmg:
    name: macOS arm64 .dmg (unsigned, internal)
    needs: macos-arm64
    if: vars.BW_MAC_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      cacheKey: bw-pixi-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            FC-${{ env.cacheKey }}-${{ github.ref }}-
            FC-${{ env.cacheKey }}-refs/heads/main-
            FC-${{ env.cacheKey }}-

      - name: Configure, build, install
        run: |
          pixi run configure-${{ env.config }}
          pixi run build-${{ env.config }}
          pixi run install-${{ env.config }}

      - name: Make .dmg
        env:
          BW_ADHOC_SIGN: "1"
        run: pixi run bash package/bruceworx/make-dmg.sh "" dist

      - name: Upload .dmg
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: FreeCAD-BruceWorx-macOS-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # Manual-only full build on GitHub-hosted Apple Silicon (macos-15 is arm64).
  # Independent of BW_MAC_RUNNER. Does not use the self-hosted runner.
  # upload_dmg adds make-dmg.sh, a second STEP check on the packaged FreeCADCmd,
  # and the ~1.7 GB artifact. Default dispatch skips that upload.
  macos-arm64-hosted-dmg:
    name: macOS arm64 hosted build + STEP (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 350
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      builddir: ${{ github.workspace }}/build/release/
      logdir: ${{ github.workspace }}/logs/
      cacheKey: bw-pixi-macos-15-arm64
      BW_ARTIFACT: FreeCAD_BruceWorx-1.1.4-bw.1-macos-arm64-unsigned
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - name: Add problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/problemMatcher/clang.json"

      - name: Make directories
        run: mkdir -p "$builddir" "$logdir"

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            FC-${{ env.cacheKey }}-${{ github.ref }}-
            FC-${{ env.cacheKey }}-refs/heads/main-
            FC-${{ env.cacheKey }}-

      - name: ccache stats (before)
        run: |
          pixi run ccache -z
          pixi run ccache -p

      - name: CMake configure
        run: pixi run configure-${{ env.config }}

      - name: CMake build
        run: pixi run build-${{ env.config }}

      - name: ccache stats (after)
        if: always()
        run: pixi run ccache -s

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}

      - name: CMake install
        run: pixi run install-${{ env.config }}

      - name: BruceWorx STEP import check (installed FreeCADCmd)
        shell: bash
        run: |
          set -o pipefail
          stepfile="${{ github.workspace }}/data/tests/Step/as1-ac-214.stp"
          test -f "$stepfile"
          pixi run FreeCADCmd "${{ github.workspace }}/package/bruceworx/step-import-check.py" --pass "$stepfile" 2>&1 | tee "${logdir}StepImport.log"
          grep -q "BW STEP check: PASS" "${logdir}StepImport.log"
          grep "BW STEP check:" "${logdir}StepImport.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Make unsigned .dmg
        if: inputs.upload_dmg
        run: pixi run bash package/bruceworx/make-dmg.sh "" dist

      - name: BruceWorx STEP import check (packaged app FreeCADCmd)
        if: inputs.upload_dmg
        shell: bash
        run: |
          set -o pipefail
          dmg="$(ls dist/*.dmg | head -1)"
          ls -lh "$dmg"
          mnt="$RUNNER_TEMP/bwdmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          cmd="$mnt/FreeCAD BruceWorx.app/Contents/Resources/bin/FreeCADCmd"
          stepfile="${{ github.workspace }}/data/tests/Step/as1-ac-214.stp"
          set +e
          "$cmd" "${{ github.workspace }}/package/bruceworx/step-import-check.py" --pass "$stepfile" 2>&1 | tee "${logdir}StepImportApp.log"
          rc=$?
          set -e
          hdiutil detach "$mnt" || true
          grep -q "BW STEP check: PASS" "${logdir}StepImportApp.log"
          grep "BW STEP check:" "${logdir}StepImportApp.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload unsigned .dmg
        if: inputs.upload_dmg
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.BW_ARTIFACT }}
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bw-macos-15-arm64-logs
          path: ${{ env.logdir }}

  # Cheap check on every pull request: the lockfile still solves, and the
  # osx-arm64 environment actually installs on GitHub-hosted Apple Silicon.
  # The full macOS compile stays on workflow_dispatch (macos-arm64-hosted-dmg).
  pixi-lock:
    name: pixi lock (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-64
            install: false
          - os: macos-15
            name: osx-arm64
            install: true
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false
          run-install: false

      - name: Check lockfile
        run: pixi lock --check

      - name: Install locked environment
        if: matrix.install
        run: pixi install --locked

      - name: Show environment
        if: matrix.install
        run: |
          pixi info
          pixi run python -c "import platform,sys; print(platform.machine(), sys.version)"

  # Preference-pack tests do not need a FreeCAD build. They check the cfg
  # inventory, the enable/disable snapshot, the stylesheet tokens and that
  # BW_MAC_RUNNER is still gated.
  bruceworx-pack:
    name: BruceWorx preference pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Preference pack tests
        run: python3 src/Mod/BruceWorx/test_bruceworx_pack.py
